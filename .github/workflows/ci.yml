name: CI

on:
  pull_request:
    branches: [main]
    # edited: 積んだ PR の向き先を main に変えた時にも動かす。
    # 題名・説明だけの変更では、下の jobs.check.if で実行しない
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # 題名・説明だけの変更は別のグループにして、実行中の CI を止めないようにする
  group: ci-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edited' || '' }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      # 営業用のデモ(/demo/)のビルド(デモの部品が入っていること・外につながない CSP を確かめる)
      - name: Build demo
        run: pnpm build:demo

      # スマホの幅(375px)で主な画面を開き、横にはみ出す箇所が無いことを確かめる
      # (テスト用の設定でもう一度ビルドし、ランナーの Chrome で開く)
      - name: Layout check (375px)
        run: pnpm check:layout

      # 公開前の通しテスト(画面): check:layout と同じ設定のビルド(out/)を使い、画面からの通信を
      # 本物の gas/Code.gs・registry/Code.gs(メモリの上)につないで、ログイン・ログアウト・権限・団体の分離・URL の直打ちを確かめる
      - name: End-to-end (browser)
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: '1'
