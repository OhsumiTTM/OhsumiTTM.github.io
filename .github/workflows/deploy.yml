name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ secrets.FEEDBACK_FORM_URL }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_READ: ${{ secrets.GOOGLE_CALENDAR_READ }}
          # レジストリ。団体の接続先は、招待リンクの団体ID からレジストリが答える(ビルド時の既定の団体は無い)。
          # 未設定なら、Ohsumi の画面と管理画面(/registry-admin/)は「設定されていません」と出すだけ
          NEXT_PUBLIC_REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          NEXT_PUBLIC_REGISTRY_OAUTH_CLIENT_ID: ${{ secrets.REGISTRY_OAUTH_CLIENT_ID }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
